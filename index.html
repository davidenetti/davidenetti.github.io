---
layout: default
title: Home
---
<html>
  <head>
    <link rel="stylesheet" href="assets/css/style.css">
  </head>

  <body>
    <h1>Latest Posts</h1>
    <ul>
      {% for post in site.posts %}
        <li>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          <span> - {{ post.date | date: "%b %d, %Y" }}</span>
        </li>
      {% endfor %}
    </ul>
  </body>
</html>
