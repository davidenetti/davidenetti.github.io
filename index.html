---
layout: default
title: Home
---

<h2>Latest Posts</h2>
<div class="post-list">
  {% for post in site.posts %}
    <article class="post-item">
      <span class="post-meta">{{ post.date | date: "%b %d, %Y" }}</span>
      <h3 class="post-title">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </h3>
      <p class="post-excerpt">{{ post.excerpt | strip_html | truncatewords: 25 }}</p>
    </article>
  {% endfor %}
</div>
