<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ page.title }}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    </head>
    
    <body>
        <header class="main-header">
            <div class="container">
                <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
                <p class="description">{{ site.description }}</p>

                <nav class="main-nav">
                    <a href="{{ '/whoami' | relative_url }}">Whoami</a>
                    <a href="{{ '/publications' | relative_url }}">Publications</a>
                </nav>
                <div id="search-container">
                    <input type="text" id="search-input" 
                        placeholder="Search by title or tags..." 
                        data-search-path="{{ '/search.json' | relative_url }}">
                        <ul id="results-container"></ul>
                </div>
            </div>
        </header>
    
        <main class="container">
            <article class="content">
                {{ content }}
            </article>
        </main>
    
        <footer class="main-footer">
            <div class="social-links">
                <a href="https://github.com/davidenetti" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com/in/davidenetti" target="_blank"><i class="fab fa-linkedin"></i></a>
            </div>
            <div class="container">
                <p>&copy; {{ site.time | date: '%Y' }} - Powered by Jekyll</p>
            </div>
            
        </footer>
    
        <script src="{{ '/assets/js/simple-jekyll-search.min.js' | relative_url }}"></script>
        <script src="{{ '/assets/js/search-script.js' | relative_url }}"></script>
    </body>
</html>
